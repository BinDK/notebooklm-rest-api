<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { width: 280px; margin: 0; padding: 16px; color: #172033; font: 14px/1.45 system-ui, sans-serif; }
    h1 { margin: 0 0 8px; font-size: 17px; }
    p { color: #536174; }
    button { width: 100%; border: 0; border-radius: 8px; padding: 10px; background: #175cd3; color: white; font: inherit; cursor: pointer; }
    button:disabled { opacity: .55; cursor: wait; }
    #status { min-height: 40px; }
  </style>
</head>
<body>
  <h1>NotebookLM session</h1>
  <p id="status">Export your NotebookLM session, then upload the file on the setup page.</p>
  <button id="export">Download storage_state.json</button>
  <script src="popup.js"></script>
</body>
</html>
